services:
  bee-hunt:
    build: .
    container_name: bee-hunt-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
    volumes:
      - sqlite_data:/app/data
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    container_name: bee-hunt-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bee-hunt

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
